# 通知テンプレート（13. バッチ・通知設計 3.3 節）。キー = 通知種別[.区分].subject / .body
# プレースホルダは ${name} 形式。本文の改行は \n
01.1.subject=[申込管理] お申込内容のご確認のお願い（申込番号 ${applicationNo}）
01.1.body=${applicantName} 様\nお申込内容をご確認のうえ、以下の URL から同意の手続きをお願いいたします。\n確認 URL：${baseUrl}/consent/${token}\n有効期限：${expiresAt}\n有効期限を過ぎると URL は無効になります。その場合は担当者（${ownerName}）までご連絡ください。\n本メールに心当たりがない場合は、お手数ですが破棄してください。
01.2.subject=[申込管理] 契約変更内容のご確認のお願い（申込番号 ${applicationNo}）
01.2.body=${applicantName} 様\nお申込（申込番号 ${applicationNo}）の契約変更内容をご確認のうえ、以下の URL から同意の手続きをお願いいたします。\n確認画面では変更前の内容と変更後の内容を並べて表示します。\n確認 URL：${baseUrl}/consent/${token}\n有効期限：${expiresAt}\n有効期限を過ぎると URL は無効になります。その場合は担当者（${ownerName}）までご連絡ください。\n本メールに心当たりがない場合は、お手数ですが破棄してください。
02.subject=[申込管理] 承認依頼：${approvalTypeName}（申込番号 ${applicationNo}）
02.body=${approverName} 様\n以下の申込について ${approvalTypeName} の承認をお願いします（ステップ ${stepNo}／${finalStepNo}）。\n申込番号：${applicationNo}　申込者名：${applicantName}　担当者：${ownerName}　申請者：${requesterName}\n申込詳細：${detailUrl}
02.final.body=${approverName} 様\n以下の申込について ${approvalTypeName} の内容を確認のうえ、審査担当部門への審査申請をお願いします（ステップ ${stepNo}／${finalStepNo}）。\n申込番号：${applicationNo}　申込者名：${applicantName}　担当者：${ownerName}　申請者：${requesterName}\n申込詳細：${detailUrl}
03.subject=[申込管理] 差戻し：${approvalTypeName}（申込番号 ${applicationNo}）
03.body=${requesterName} 様\n以下の申込が ${approverName} により差し戻されました（ステータス：${statusName}）。内容を確認のうえ、必要に応じて修正し、再度申請してください。\n申込番号：${applicationNo}　申込者名：${applicantName}　差戻し日時：${occurredAt}\n差戻し理由：${comment}\n申込詳細：${detailUrl}
04.subject=[申込管理] 申込者からの差戻し（申込番号 ${applicationNo}）
04.body=${ownerName} 様\n以下の申込が申込者により差し戻されました（ステータス：${statusName}）。差戻し理由を確認し、申込者と調整のうえ、内容を修正して再度申請してください。\n申込番号：${applicationNo}　申込者名：${applicantName}　差戻し日時：${occurredAt}\n差戻し理由：${returnReason}\n申込詳細：${detailUrl}
05.subject=[申込管理] 事前確認結果「修正必要」（申込番号 ${applicationNo}）
05.body=${ownerName} 様\n以下の申込について、審査担当部門の事前確認結果が「修正必要」でした（ステータス：${statusName}）。指摘内容を確認し、申込修正画面から修正対応をお願いします。\n申込番号：${applicationNo}　申込者名：${applicantName}　受信日時：${occurredAt}\n指摘内容：${resultReason}\n申込詳細：${detailUrl}
06.completed.subject=[申込管理] 審査完了（申込番号 ${applicationNo}）
06.completed.body=${ownerName} 様\n以下の申込の審査が完了しました（ステータス：${statusName}）。\n申込番号：${applicationNo}　申込者名：${applicantName}　審査完了日時：${reviewedAt}\n申込詳細：${detailUrl}
06.returned.subject=[申込管理] 審査差戻し（申込番号 ${applicationNo}）
06.returned.body=${ownerName} 様\n以下の申込が審査担当部門から差し戻されました（ステータス：${statusName}）。差戻し理由を確認し、必要に応じて修正のうえ、再度最終承認を申請してください。\n申込番号：${applicationNo}　申込者名：${applicantName}　受信日時：${occurredAt}\n差戻し理由：${resultReason}\n申込詳細：${detailUrl}
06.returned-change.body=${ownerName} 様\n以下の申込の契約変更が審査担当部門から差し戻されました。契約変更の内容は取り消され、契約変更前の審査完了の状態（ステータス：${statusName}、第 ${reviewedVersionNo} 版）に戻っています。差戻し理由を確認のうえ、必要であれば契約変更手続きをやり直してください。\n申込番号：${applicationNo}　申込者名：${applicantName}　受信日時：${occurredAt}\n差戻し理由：${resultReason}\n申込詳細：${detailUrl}
07.subject=[申込管理] 審査担当部門システムへの送信エラー（申込番号 ${applicationNo}）
07.body=以下の依頼が再送上限に達したか、審査担当部門システムに受け付けられず、送信エラーになりました。\n申込のステータス（${statusName}）は変わらず、再送するまで審査担当部門からの結果は届きません。内容を確認のうえ、申込詳細画面から再送してください。\n申込番号：${applicationNo}　連携種別：${linkTypeName}　外部連携 ID：${externalLinkId}\nエラー内容：${errorMessage}\n確定日時：${occurredAt}\n申込詳細：${detailUrl}
08.subject=[申込管理] 申込者ページのご案内（申込番号 ${applicationNo}）
08.body=${applicantName} 様\n申込番号 ${applicationNo} のお申込について、申込内容の確認・同意などのお手続きを行う申込者ページをご用意しました。\n以下の情報でログインしてください。\nログイン URL：${baseUrl}/my/login\nユーザー ID：${loginId}\n初期パスワード：${initialPassword}\n初回ログイン後に「パスワード変更」からパスワードを変更してください。\n本メールに心当たりがない場合は、お手数ですが破棄してください。
