# ======================================================================
# 申込管理システム 設定（既定値）
# 同じキーを環境変数で上書きできる（例: db.url -> DB_URL、app.employee-base-url -> APP_EMPLOYEE_BASE_URL）。
# システムプロパティ（-Ddb.url=...）でも上書きできる。優先順位: システムプロパティ > 環境変数 > 本ファイル
# ======================================================================

# --- DB（SQL Server 2019。docker-compose.yml の db サービス） ---
db.url=jdbc:sqlserver://localhost:1433;databaseName=appmgmt;encrypt=true;trustServerCertificate=true
db.user=appmgmt
db.password=Appmgmt#2026
db.pool.max-size=10
# 起動時に DB へ接続できるまで待つ秒数（コンテナ起動順の吸収用）
db.startup-wait-seconds=120

# --- アプリ ---
# 申込者向け確認 URL と社員向け画面リンクのベース URL（末尾スラッシュなし）
app.applicant-base-url=http://localhost:8080
app.employee-base-url=http://localhost:8080
# 開発支援画面（通知一覧・審査担当部門システムモック・バッチ即時実行）の有効化。本番では false
app.dev-tools.enabled=true
# 外部システム ID（審査担当部門システムからの結果受信時の操作者 ID）
app.external-system-id=EXT01
# セッションタイムアウト（分）
app.session-timeout-minutes=30

# --- 申込者確認用トークン ---
consent.token-expire-days=14

# --- バッチ（13. バッチ・通知設計 2.5 節） ---
batch.enabled=true
batch.initial-delay-seconds=10
batch.shutdown-wait-seconds=30
batch.notification.interval-seconds=15
batch.notification.max-rows=100
batch.notification.retry-limit=3
batch.external.interval-seconds=15
batch.external.max-rows=100
batch.external.retry-limit=3
batch.external.abort-after-consecutive-failures=5

# --- メール（mail.mode=log はログ出力のみ、smtp は SMTP 送信） ---
mail.mode=log
mail.smtp.host=localhost
mail.smtp.port=1025
mail.smtp.starttls=false
mail.smtp.auth=false
mail.smtp.user=
mail.smtp.password=
mail.smtp.connection-timeout-ms=5000
mail.smtp.timeout-ms=30000
mail.from.address=appmgmt@example.com
mail.from.name=申込管理システム
mail.reply-to.address=

# --- 審査担当部門システム API（extapi.mode=mock は内部モック、http は実送信） ---
extapi.mode=mock
extapi.base-url=http://localhost:9000
extapi.precheck-path=/precheck-requests
extapi.review-path=/review-requests
extapi.api-key=
extapi.connect-timeout-ms=5000
extapi.read-timeout-ms=30000
# 結果受信（IF02/IF04）の認証。api-key が空なら検証しない（開発用）。allowed-ips はカンマ区切り、空なら制限なし
extapi.inbound.api-key=
extapi.inbound.allowed-ips=
